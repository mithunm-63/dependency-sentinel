services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dependency_sentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sentinel_pg:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/dependency_sentinel
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      FRONTEND_ORIGIN: http://localhost:5173
      PORT: 8081
    ports:
      - "8081:8081"

volumes:
  sentinel_pg:
